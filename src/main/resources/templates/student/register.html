<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja Studenta</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background: #f5f5f5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 300px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .nav {
            margin-bottom: 20px;
        }

        .nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #2196F3;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="nav">
    <a href="/students">👨 Studenci</a>
    <a href="/teachers">👨‍🏫 Nauczyciele</a>
    <a href="/lessons">📚 Lekcje</a>
</div>

<h1>Rejestracja nowego studenta</h1>

<form th:action="@{/students/create}" method="post">

    <div class="form-group">
        <label for="firstName">Imię:</label>
        <input
                type="text"
                id="firstName"
                name="firstName"
                required>
    </div>

    <div class="form-group">
        <label for="lastName">Nazwisko:</label>
        <input
                type="text"
                id="lastName"
                name="lastName"
                required>
    </div>

    <div class="form-group">
        <label for="language">Język programowania:</label>

        <select id="language" name="language" required>
            <option value="">-- Wybierz język --</option>

            <option
                    th:each="lang : ${languages}"
                    th:value="${lang}"
                    th:text="${lang}">
            </option>
        </select>
    </div>

    <div class="form-group">
        <label for="teacherId">Nauczyciel:</label>

        <select id="teacherId" name="teacherId" required disabled>
            <option value="">-- Najpierw wybierz język --</option>
        </select>
    </div>

    <button type="submit" class="btn">Zapisz</button>

    <a href="/students" style="margin-left: 10px;">
        Anuluj
    </a>

</form>

<script>
    const languageSelect = document.getElementById("language");
    const teacherSelect = document.getElementById("teacherId");

    languageSelect.addEventListener("change", function () {
        const selectedLanguage = languageSelect.value;

        teacherSelect.disabled = true;
        teacherSelect.innerHTML =
            '<option value="">-- Pobieranie nauczycieli --</option>';

        if (!selectedLanguage) {
            teacherSelect.innerHTML =
                '<option value="">-- Najpierw wybierz język --</option>';
            return;
        }

        fetch(`/teachers?language=${encodeURIComponent(selectedLanguage)}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Nie udało się pobrać nauczycieli");
                }

                return response.json();
            })
            .then(teachers => {
                teacherSelect.innerHTML =
                    '<option value="">-- Wybierz nauczyciela --</option>';

                if (teachers.length === 0) {
                    teacherSelect.innerHTML =
                        '<option value="">-- Brak nauczycieli dla tego języka --</option>';

                    teacherSelect.disabled = true;
                    return;
                }

                teachers.forEach(teacher => {
                    const option = document.createElement("option");

                    option.value = teacher.id;
                    option.textContent =
                        `${teacher.firstName} ${teacher.lastName}`;

                    teacherSelect.appendChild(option);
                });

                teacherSelect.disabled = false;
            })
            .catch(error => {
                console.error(error);

                teacherSelect.disabled = true;
                teacherSelect.innerHTML =
                    '<option value="">-- Błąd pobierania nauczycieli --</option>';
            });
    });
</script>

</body>
</html>
